name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile-check scripts
        run: python -m py_compile llms-txt-generator.py llms-txt-benchmark.py validate.py
      - name: Validate llms.txt files against the spec
        run: python validate.py
